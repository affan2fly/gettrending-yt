<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Trending Indonesia (Play In-App)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        h1 { text-align: center; color: #ff0000; margin-bottom: 30px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        
        /* Gaya Kartu */
        .card { background: #2d2d2d; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #444; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: #ff0000; }
        
        /* Container Video Responsif (Rasio 16:9) */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background-color: black; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Konten Teks */
        .content { padding: 18px; }
        .title { font-size: 1.05em; font-weight: bold; margin: 0 0 10px; color: #eee; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; line-clamp: inherit; }
        .channel { color: #aaa; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .channel-icon { color: #ff0000; }

        /* Pesan Loading/Error */
        .status-msg { text-align: center; grid-column: 1/-1; font-size: 1.2em; color: #aaa; margin-top: 50px; }
    </style>
</head>
<body>

    <h1>🔥 Trending YouTube Indonesia</h1>
    <div id="video-container" class="container">
        <p class="status-msg">Sedang memuat video trending...</p>
    </div>

    <script>
        // GANTI DENGAN API KEY ANDA YANG VALID
        const API_KEY = 'AIzaSyAuvbmsWC7kEjTj1dc8jwXGIbGo7Ixm-Yc'; 
        
        async function fetchTrendingVideos() {
            // Parameter API tetap sama
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=ID&maxResults=12&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const container = document.getElementById('video-container');
                container.innerHTML = ''; // Hapus pesan loading

                if (data.items && data.items.length > 0) {
                    data.items.forEach(video => {
                        const snippet = video.snippet;
                        const videoId = video.id;
                        
                        // Membuat struktur kartu dengan Iframe Embed
                        const card = `
                            <div class="card">
                                <div class="video-wrapper">
                                    <iframe 
                                        src="https://www.youtube.com/embed/${videoId}" 
                                        title="${snippet.title}"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen
                                        loading="lazy"> </iframe>
                                </div>
                                <div class="content">
                                    <div class="title">${snippet.title}</div>
                                    <div class="channel">
                                        <span class="channel-icon">▶</span> ${snippet.channelTitle}
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p class="status-msg">Gagal memuat video.<br>Pastikan API Key Anda valid dan kuota API belum habis.</p>';
                    console.error("API Response Error:", data);
                }
            } catch (error) {
                console.error("Connection Error:", error);
                document.getElementById('video-container').innerHTML = '<p class="status-msg">Terjadi kesalahan koneksi.</p>';
            }
        }

        // Jalankan fungsi setelah halaman dimuat
        if (API_KEY === 'YOUR_YOUTUBE_API_KEY') {
            document.getElementById('video-container').innerHTML = '<p class="status-msg">⚠️ Anda belum memasukkan API Key.<br>Buka kode file dan ganti YOUR_YOUTUBE_API_KEY dengan kunci Anda.</p>';
        } else {
            fetchTrendingVideos();
        }
    </script>
</body>
</html>
